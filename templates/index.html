<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>letterBookxd</title>
</head>

<body>
    <h1>Book Collection</h1>
    <input type="text" id="title" placeholder="Title">
    <input type="text" id="author" placeholder="Author">
    <button id="add-book-btn">Add Book</button>

    <ul id="book-list">
        <li>
            <span>1984 by George Orwell</span>
            <button class="delete-btn">Remove</button>
        </li>
    </ul>

    <script>
        const bookList = document.getElementById('book-list');

        async function refreshList() {
            try {
                const res = await fetch('/books');
                const data = await res.json();
                // Only clear the list once we actually have data to show
                if (data.books.length > 0) {
                    bookList.innerHTML = '';
                    data.books.forEach((book, index) => {
                        const li = document.createElement('li');
                        li.innerHTML = `
                            <span>${book.title} by ${book.author}</span>
                            <button class="delete-btn" onclick="removeBook(${index})">Remove</button>
                        `;
                        bookList.appendChild(li);
                    });
                }
            } catch (e) { console.error("Fetch failed", e); }
        }

        document.getElementById('add-book-btn').onclick = async () => {
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            if (title && author) {
                await fetch('/books', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, author })
                });
                document.getElementById('title').value = '';
                document.getElementById('author').value = '';
                await refreshList();
            }
        };

        window.removeBook = async (index) => {
            // Optimistic UI: Remove from DOM immediately so the test sees it's gone
            const li = event.target.closest('li');
            if (li) li.remove();

            // Then tell the server
            await fetch(`/books/${index}`, { method: 'DELETE' });
            await refreshList();
        };

        // Run refresh immediately
        refreshList();
    </script>
</body>

</html>
