<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>letterBookxd</title>
    <style>
        #book-list {
            min-height: 20px;
        }
    </style>
</head>

<body>
    <h1>letterBookxd</h1>

    <input type="text" id="title" placeholder="Title">
    <input type="text" id="author" placeholder="Author">
    <button id="add-book-btn">Add Book</button>

    <ul id="book-list"></ul>

    <script>
        const bookList = document.getElementById('book-list');

        // Helper to render the list from the backend
        async function fetchAndRender() {
            const res = await fetch('/books');
            const data = await res.json();
            bookList.innerHTML = '';

            data.books.forEach((book, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>${book.title} by ${book.author}</span>
                    <button class="delete-btn" onclick="removeBook(${index})">Remove</button>
                `;
                bookList.appendChild(li);
            });
        }

        // Add Book logic
        document.getElementById('add-book-btn').onclick = async () => {
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;

            if (title && author) {
                await fetch('/books', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, author })
                });
                document.getElementById('title').value = '';
                document.getElementById('author').value = '';
                fetchAndRender();
            }
        };

        // Remove Book logic
        window.removeBook = async (index) => {
            await fetch(`/books/${index}`, { method: 'DELETE' });
            fetchAndRender();
        };

        // CRITICAL: Load the data when the page opens so Story 3 finds a button
        window.onload = fetchAndRender;
    </script>
</body>

</html>
