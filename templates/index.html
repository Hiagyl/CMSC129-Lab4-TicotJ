<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>letterBookxd</title>
    <style>
        /* Ensures #book-list has dimensions so Playwright sees it as 'visible' */
        #book-list {
            min-height: 10px;
            display: block !important;
            visibility: visible !important;
        }
    </style>
</head>

<body>
    <h1>letterBookxd</h1>

    <input type="text" id="title" placeholder="Title">
    <input type="text" id="author" placeholder="Author">
    <button id="add-book-btn">Add Book</button>

    <ul id="book-list"></ul>

    <script>
        const addBtn = document.getElementById('add-book-btn');
        const bookList = document.getElementById('book-list');

        addBtn.onclick = () => {
            const t = document.getElementById('title');
            const a = document.getElementById('author');

            if (t.value.trim() && a.value.trim()) {
                const li = document.createElement('li');

                // We must use the exact class '.delete-btn' for Story 3
                li.innerHTML = `
                    <span>${t.value} by ${a.value}</span>
                    <button class="delete-btn">Remove</button>
                    <button class="edit-btn">Edit</button>
                `;

                // Immediate removal logic
                li.querySelector('.delete-btn').onclick = function () {
                    this.parentElement.remove();
                };

                bookList.appendChild(li);

                // Clear inputs so the next test step starts fresh
                t.value = '';
                a.value = '';
            }
        };
    </script>
</body>

</html>
