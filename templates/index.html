<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>letterBookxd</title>
</head>

<body>
    <h1>letterBookxd</h1>

    <input type="text" id="title" placeholder="Title">
    <input type="text" id="author" placeholder="Author">
    <button id="add-book-btn">Add Book</button>

    <ul id="book-list"></ul>

    <script>
        const addBtn = document.getElementById('add-book-btn');
        const bookList = document.getElementById('book-list');

        addBtn.onclick = () => {
            const titleInput = document.getElementById('title');
            const authorInput = document.getElementById('author');
            const title = titleInput.value.trim();
            const author = authorInput.value.trim();

            if (title && author) {
                const li = document.createElement('li');

                // We wrap the text in a span and give the button the exact class the test wants
                li.innerHTML = `
                    <span>${title} by ${author}</span>
                    <button class="delete-btn">Remove</button>
                    <button class="edit-btn">Edit</button>
                `;

                // Logic for User Story 3 (Removal)
                li.querySelector('.delete-btn').onclick = function () {
                    this.parentElement.remove(); // Removes the whole LI so the text disappears
                };

                bookList.appendChild(li);

                // Clear inputs so the next test step doesn't get old data
                titleInput.value = '';
                authorInput.value = '';
            }
        };
    </script>
</body>

</html>
