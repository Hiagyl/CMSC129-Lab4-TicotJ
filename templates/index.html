<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>letterBookxd</title>
</head>

<body>
    <h1>Book Collection</h1>
    <input type="text" id="title" placeholder="Title">
    <input type="text" id="author" placeholder="Author">
    <button id="add-book-btn">Add Book</button>

    <ul id="book-list" style="min-height: 20px;"></ul>

    <script>
        const bookList = document.getElementById('book-list');

        async function refreshList() {
            const res = await fetch('/books');
            const data = await res.json();
            bookList.innerHTML = '';
            data.books.forEach((book, index) => {
                const li = document.createElement('li');
                // The class MUST be exactly 'delete-btn' for the test to find it
                li.innerHTML = `
                    <span>${book.title} by ${book.author}</span>
                    <button class="delete-btn" onclick="removeBook(${index})">Remove</button>
                `;
                bookList.appendChild(li);
            });
        }

        document.getElementById('add-book-btn').onclick = async () => {
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            if (title && author) {
                await fetch('/books', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, author })
                });
                document.getElementById('title').value = '';
                document.getElementById('author').value = '';
                await refreshList();
            }
        };

        window.removeBook = async (index) => {
            await fetch(`/books/${index}`, { method: 'DELETE' });
            await refreshList();
        };

        // CRITICAL: This satisfies Story 3 by loading the items on page start
        window.onload = refreshList;
    </script>
</body>

</html>
